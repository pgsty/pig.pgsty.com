#=======================================#
# Basics
#=======================================#
baseURL: https://pig.pgsty.com/
title: PIG - Packager Index Gateway
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写（不要把 pg_duckdb 渲染成 Pg_duckdb）。
capitalizeListTitles: false

# 列表页每页条目数（博客列表、标签页等）。放宽到 60，让 /release/ 的全部版本
# 在一页里列完，不必翻页。
pagination:
  pagerSize: 60

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
      disable: false

