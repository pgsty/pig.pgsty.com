#=======================================#
# Taxonomies and blog URLs
#=======================================#
# authors 是 OINK 的作者分类法：声明它就够了，作者档案就是
# content/authors/<slug>/_index.md 这张词条页（标题=显示名，description=一句话简介）。
taxonomies:
  categories: categories
  tags: tags
  author: authors

# 博客内容按栏目组织在 content/blog/ 下，但 URL 不带 blog 前缀：
# content/blog/release/pig-1.6.0.md → /release/pig-1.6.0/
# content/blog/release/_index.md    → /release/
# :sections[1:] 丢掉第一段（blog），新开的博客栏目自动照此规则。
# content/blog/_index.md 自身会算出 "/"，所以它在 front matter 里显式写死 url。
permalinks:
  page:
    blog: '/:sections[1:]/:contentbasename/'
  section:
    blog: '/:sections[1:]/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['\[', '\]']
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  # OINK supplies Markdown page copies, an AI-oriented llms.txt index,
  # and printable section bundles. The 0.3 command palette uses its own
  # language-local resource index, so the home page no longer needs JSON.
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Services
#=======================================#
# Google Analytics 4：pig.pgsty.com 自己的数据流，别沿用其它站点的 ID。
# 埋点仅生产构建注入（OINK head.html / layouts/index.html 都用 hugo.IsProduction
# 包裹），本地 hugo server 不会加载。
services:
  googleAnalytics:
    id: G-1D95QFXC80

#=======================================#
# Site parameters
#=======================================#
params:
  description: "PIG is a PostgreSQL extension package manager: resolve and install PostgreSQL kernels and cataloged extension packages on EL, Debian, and Ubuntu with one self-contained CLI."
  images:
    - img/pig-social-card.png
  # OINK 文档 chrome 使用 PIG 的站点品牌图；静态路径会由主题自动解析。
  logo: img/pig.svg
  wordmark: img/pig-word.svg
  version: 1.8.0            # pig 最新版本号（= internal/config.PigVersion），正文用 {{< param version >}}
  pigsty_version: 4.5.0     # pig 内置的 Pigsty 版本（= internal/config.PigstyVersion）
  pgext_count: 575          # Pigsty 已打包 PG 扩展数量，正文用 {{< param pgext_count >}}
  # 页脚版权行（OINK footer/copyright.html 会按 Markdown 渲染 authors）。
  # 中英两版署名不同，各自写在下面的 languages 块里。
  copyright:
    from_year: 2025
    url: https://pgsty.com

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  # 页面 front matter 可单页覆盖（page_width: wide），栏目可经 cascade 继承。
  page_width: normal
  # 页脚底栏中间那句话（接受行内 Markdown，OINK 默认是 "Powered by Oink"）。
  # ICP 备案号也放这里，例如：
  # footer_center_info: '[浙ICP备15016890号-2](https://beian.miit.gov.cn/)'
  footer_center_info: 'Built with [OINK](https://oink.pgsty.com/)'

  archived_version: false
  url_latest_version: https://pig.pgsty.com

  # GitHub Discussions 评论（giscus）。讨论区开在站点仓库 pgsty/pig.pgsty.com 下，
  # 与 silo.pgsty.com 的做法一致：产品仓库的 Discussions 留给用户提问，
  # 站点页面的评论不去占它。strict=1 用 pathname 的哈希精确匹配线程。
  # 首页与下载页是自定义整页模板，不走 page-end，因此不渲染评论。
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/pig.pgsty.com
      repoId: R_kgDOTyDjmw
      category: Announcements
      categoryId: DIC_kwDOTyDjm84DDDv-
      mapping: pathname
      strict: 1
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
      theme: auto
      loading: lazy
  github_repo: https://github.com/pgsty/pig.pgsty.com
  github_project_repo: https://github.com/pgsty/pig
  github_branch: main

  # 文档、博客与定制首页统一使用 OINK 的本地命令面板；summary 在搜索
  # 召回率与下载体积之间取平衡，关键词与 boost 仍可在页面 front matter 覆盖。
  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 100
  offline_search_max_results: 12

  ui:
    blog_index_size: 60
    # 页尾分享栏：每一项都是普通 <a href> 意图链接或本地复制按钮，
    # 不引入任何第三方脚本、样式或计数。只有单页会渲染它。
    share: [x, hackernews, reddit, telegram, weibo, email, copy]
    # 让读者在列表 / 卡片 / 表格三种索引形态之间切换（工具栏里那个按钮）。
    # 每个栏目的首发形态由自己的 front matter blog_index 决定。
    blog_index_toggle: true
    breadcrumb: true
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    docs_sidebar_root: home
    sidebar_icon_policy: groups
    sidebar_expand_levels: 2
    dark_mode:
      show_menu: true
    quick_links: [docs, blog]
    page_context_menu:
      # Activating these entries hands the current public URL to the selected
      # assistant; the theme performs no handoff until the visitor chooses it.
      assistant_links: true
    # OINK shell 自己维护目录状态，不启用 Bootstrap ScrollSpy。
    scroll_spy: false
    # ---- OINK 文档 shell 配置 ----
    # 搜索框下方的根节点下拉：列出 /docs/ 总览 + 所有 sidebar_root_for: self
    # 的 section（这里就是 Blog）。
    sidebar_root_menu: true
    # 侧栏宽度（px）：默认宽随断点 268/286，可拖拽调整并持久化；
    # min/max 为拖拽钳制范围，可在栏目 front matter 中经 cascade 覆盖。
    sidebar_width_min: 220
    sidebar_width_max: 480
    # 侧栏条目文字溢出策略：ellipsis（省略号，默认）| wrap（换行）。
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    reading_time: false
