<?xml version="1.0" encoding="UTF-8"?>
<!-- Text-only wordmark. OINK 0.6 renders the brand as a lockup: the mark
     (img/pig.svg) always shows and this is the text half beside it, so the
     emblem must not be repeated here. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="212" height="99" viewBox="0 0 212 99"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="pig-word-title"
     shape-rendering="geometricPrecision">
  <title id="pig-word-title">PIG</title>

  <defs>
    <linearGradient id="pig-word-ink" x1="150" y1="20" x2="370" y2="112" gradientUnits="userSpaceOnUse">
      <stop class="wm-a" offset="0.06" stop-color="#1d588c"/>
      <stop class="wm-b" offset="0.94" stop-color="#b4762e"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        .wm-a { stop-color: #7fb8e8; }
        .wm-b { stop-color: #e0a35c; }
      }
    </style>
  </defs>

  <!-- Chakra Petch Bold outlines keep the wordmark independent of webfont loading. -->
  <g aria-hidden="true" fill="url(#pig-word-ink)"
     transform="translate(-154.45 -15) translate(150 110) scale(.13 -.13)">
    <path d="M65 700H504L611 592V347L503 238H201V0H65ZM442 352 477 387V551L442 586H201V352Z"/>
    <path d="M756 700H892V0H756Z"/>
    <path d="M1057 115V585L1172 700H1520L1633 587V480H1497V537L1450 584H1244L1193 533V167L1244 116H1452L1501 165V274H1351V390H1633V115L1518 0H1172Z"/>
  </g>
</svg>
