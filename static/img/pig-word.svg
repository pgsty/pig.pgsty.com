<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="384" height="128" viewBox="0 0 384 128"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="pig-word-title pig-word-desc"
     shape-rendering="geometricPrecision">
  <title id="pig-word-title">PIG</title>
  <desc id="pig-word-desc">The PIG emblem followed by the PIG wordmark.</desc>

  <defs>
    <linearGradient id="pig-word-skin" x1="24" y1="104" x2="104" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9647f"/>
      <stop offset="0.55" stop-color="#f191a6"/>
      <stop offset="1" stop-color="#fcccd7"/>
    </linearGradient>
    <linearGradient id="pig-word-snout" x1="46" y1="98" x2="82" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bc4a68"/>
      <stop offset="1" stop-color="#e2778f"/>
    </linearGradient>
    <linearGradient id="pig-word-ink" x1="150" y1="20" x2="370" y2="112" gradientUnits="userSpaceOnUse">
      <stop class="wm-a" offset="0.06" stop-color="#1d588c"/>
      <stop class="wm-b" offset="0.94" stop-color="#b4762e"/>
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        .wm-a { stop-color: #7fb8e8; }
        .wm-b { stop-color: #e0a35c; }
      }
    </style>
  </defs>

  <g aria-hidden="true">
    <rect width="128" height="128" rx="28" fill="#0b1119"/>
    <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="26.25"
          fill="none" stroke="#3e668f" stroke-opacity="0.45" stroke-width="3.5"/>
    <g fill="url(#pig-word-skin)">
      <g stroke="url(#pig-word-skin)" stroke-width="7" stroke-linejoin="round">
        <path d="M28 31 56 39 39 62Z"/>
        <path d="M100 31 72 39 89 62Z"/>
      </g>
      <rect x="23" y="38" width="82" height="63" rx="29"/>
    </g>
    <g fill="#0b1119">
      <circle cx="47" cy="61" r="4.6"/>
      <circle cx="81" cy="61" r="4.6"/>
    </g>
    <rect x="45" y="72" width="38" height="24" rx="12" fill="url(#pig-word-snout)"/>
    <ellipse cx="56.5" cy="84" rx="3.7" ry="5.6" fill="#0b1119" fill-opacity="0.75"/>
    <ellipse cx="71.5" cy="84" rx="3.7" ry="5.6" fill="#0b1119" fill-opacity="0.75"/>

    <!-- Chakra Petch Bold outlines keep the wordmark independent of webfont loading. -->
    <g fill="url(#pig-word-ink)" transform="translate(150 110) scale(.13 -.13)">
      <path d="M65 700H504L611 592V347L503 238H201V0H65ZM442 352 477 387V551L442 586H201V352Z"/>
      <path d="M756 700H892V0H756Z"/>
      <path d="M1057 115V585L1172 700H1520L1633 587V480H1497V537L1450 584H1244L1193 533V167L1244 116H1452L1501 165V274H1351V390H1633V115L1518 0H1172Z"/>
    </g>
  </g>
</svg>
